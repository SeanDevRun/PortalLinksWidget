modules:
  jiraServiceManagement:portalHeader:
    - key: portal-links-header
      resource: portal-links
      resolver:
        function: resolver
      title: Portal Links

  jira:adminPage:
    - key: portal-links-admin
      resource: admin
      resolver:
        function: resolver
      title: Portal Links Configuration

  function:
    - key: resolver
      handler: index.handler      

resources:
  - key: portal-links
    path: static/portal-links/build

  - key: admin
    path: static/admin/build

permissions:
  scopes:
    - storage:app

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/2f92126a-2590-4217-a5f3-4b31869d72cf
